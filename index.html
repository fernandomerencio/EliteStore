<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Elite Store</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #f1f1f1;
        }

        header {
            background-color: #0d0d0d;
            color: white;
            text-align: center;
            padding: 25px;
            font-size: 34px;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 3px;
            border-bottom: 1px solid #333;
            text-shadow: 0 0 10px rgba(231, 76, 60, 0.7);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background-color: #1f1f1f;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
            border: 1px solid #333;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.4);
        }

        .login-box h2 {
            margin-bottom: 20px;
        }

        .login-box input {
            width: 90%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .login-box button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 16px;
        }

        .login-box button:hover {
            background-color: #c0392b;
        }

        #erro {
            color: #ff6b6b;
            margin-top: 10px;
        }

        .boas-vindas {
            display: none;
            margin: 30px 40px;
            font-size: 22px;
            animation: fadeIn 1s ease;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 40px;
        }

        .menu a {
            width: 320px;
            background-color: #1f1f1f;
            color: white;
            text-decoration: none;
            padding: 18px;
            border-radius: 10px;
            font-size: 18px;
            border-left: 5px solid #e74c3c;
            transition: 0.3s;
        }

        .menu a:hover {
            background-color: #2c2c2c;
            transform: translateX(10px);
        }

        .contato {
            margin: 40px;
            padding: 20px;
            width: 320px;
            background-color: #0d0d0d;
            border-radius: 10px;
            border: 1px solid #333;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="overlay" id="overlay">
        <div class="login-box">
            <h2>👋 Bem-vindo à Elite Store</h2>

            <input type="text" id="nome" placeholder="Digite seu nome">

            <button onclick="entrar()">Entrar</button>

            <p id="erro"></p>
        </div>
    </div>

    <header>
        Elite Store
    </header>

    <p class="boas-vindas" id="boasVindas"></p>

    <div class="menu">
        <a href="bone.html">🧢 Bonés</a>
        <a href="joias.html">💎 Joias</a>
        <a href="acessorios.html">🕶️ Acessórios</a>
    </div>

    <div class="contato">
        <h2>📞 Contato</h2>
        <p>Email: fernandoismaille@gmail.com</p>
    </div>

    <script>
        window.onload = function () {

    let nomeSalvo = localStorage.getItem("nomeUsuario");

    if (nomeSalvo) {

        document.getElementById("overlay").style.display = "none";

        document.getElementById("boasVindas").innerHTML =
            "👋 Bem-vindo(a), <strong>" +
            nomeSalvo +
            "</strong>! Aproveite as melhores ofertas da Elite Store.";

        document.getElementById("boasVindas").style.display = "block";

        document.getElementById("sairBtn").style.display = "inline-block";
    }
}

function entrar() {

    let nome = document.getElementById("nome").value;
    let erro = document.getElementById("erro");

    if (nome.trim() === "") {
        erro.innerHTML = "Digite seu nome para continuar.";
        return;
    }

    if (nome.length < 3) {
        erro.innerHTML = "O nome deve possuir pelo menos 3 caracteres.";
        return;
    }

    localStorage.setItem("nomeUsuario", nome);

    document.getElementById("overlay").style.display = "none";

    document.getElementById("boasVindas").innerHTML =
        "👋 Bem-vindo(a), <strong>" +
        nome +
        "</strong>! Aproveite as melhores ofertas da Elite Store.";

    document.getElementById("boasVindas").style.display = "block";

    document.getElementById("sairBtn").style.display = "inline-block";
}

function sair() {
    localStorage.removeItem("nomeUsuario");
    location.reload();
}

    </script>

</body>
</html>
